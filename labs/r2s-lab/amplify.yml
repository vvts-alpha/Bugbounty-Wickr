# Amplify Hosting — Next.js SSR (WEB_COMPUTE)
# Console: Framework = "Next.js - SSR", App root / monorepo path = vulnerable
version: 1
applications:
  - appRoot: vulnerable
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
